name: Verify pull request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hekmat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hekmat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hekmat_test
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hekmat_test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
