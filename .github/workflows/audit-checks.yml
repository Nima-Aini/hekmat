name: Verify pull request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hekmat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hekmat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hekmat_test
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hekmat_test
      - name: Render A5 print samples in Chrome
        env:
          PRINT_SAMPLE_DIR: ${{ runner.temp }}/print-samples
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p "$PRINT_SAMPLE_DIR"
          npm run test:print
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --no-pdf-header-footer --print-to-pdf="$PRINT_SAMPLE_DIR/proforma-long.pdf" "file://$PRINT_SAMPLE_DIR/proforma-long.html"
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --no-pdf-header-footer --print-to-pdf="$PRINT_SAMPLE_DIR/invoice-short.pdf" "file://$PRINT_SAMPLE_DIR/invoice-short.html"
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --no-pdf-header-footer --print-to-pdf="$PRINT_SAMPLE_DIR/customer-financial.pdf" "file://$PRINT_SAMPLE_DIR/customer-financial.html"
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --no-pdf-header-footer --print-to-pdf="$PRINT_SAMPLE_DIR/tax-declaration.pdf" "file://$PRINT_SAMPLE_DIR/tax-declaration.html"
          for pdf in "$PRINT_SAMPLE_DIR"/*.pdf; do
            pdfinfo "$pdf" | grep -E 'Pages:|Page size:'
            pdfinfo "$pdf" | grep -Fq 'pts (A5)'
          done
          test "$(pdfinfo "$PRINT_SAMPLE_DIR/proforma-long.pdf" | awk '/Pages:/ {print $2}')" -gt 1
          test "$(pdfinfo "$PRINT_SAMPLE_DIR/invoice-short.pdf" | awk '/Pages:/ {print $2}')" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a5-print-samples
          path: ${{ runner.temp }}/print-samples/*.pdf
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
